<div class="services-container">
    <mat-card *ngFor="let service of services" class="service-card" (click)="openServiceDetail(service)">
      <mat-card-header>
        <mat-card-title>{{ service.name }}</mat-card-title>
      </mat-card-header>
      <img mat-card-image [src]="service.image" alt="{{ service.name }}">
      <mat-card-content>
        <p>{{ service.description }}</p>
      </mat-card-content>
    </mat-card>
  </div>
